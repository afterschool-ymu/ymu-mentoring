<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<!-- Without this, forwarding to script.google.com would put the full URL,
     token and all, into the Referer header of the outgoing request. -->
<title>YMU Mentoring — Student Ambassadors</title>
<style>
  :root{--bg:#f6f7f9;--panel:#fff;--ink:#16181d;--muted:#6b7280;--line:#e3e6ea;
    --accent:#3b4cca;--accent-soft:#eef0ff}
  @media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1c1f25;--ink:#e9ebef;
    --muted:#9aa2ad;--line:#2c313a;--accent:#8b96ff;--accent-soft:#232842}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh;
    display:grid;place-items:center;padding:24px;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:28px 24px;max-width:420px;width:100%;text-align:center}
  h1{font-size:19px;margin:0 0 6px;letter-spacing:-.02em}
  p{color:var(--muted);font-size:14.5px;margin:0 0 18px}
  a.go{display:block;background:var(--accent);color:#fff;text-decoration:none;
    font-weight:600;padding:14px 20px;border-radius:10px;min-height:48px;
    display:flex;align-items:center;justify-content:center}
  .small{font-size:13px;margin:16px 0 0}
  .small a{color:var(--accent)}
  .err{background:#fdecea;color:#b3261e;border-radius:10px;padding:14px;font-size:14px;
    text-align:left}
  @media (prefers-color-scheme:dark){.err{background:#331c1a;color:#f2857c}}
</style>
</head>
<body>
<div class="card" id="c">
  <h1>YMU Music Mentoring</h1>
  <p>Taking you to your mentor page. Sign in with the Google account YMU has on file for you.</p>
  <a class="go" id="go" href="#">Open my mentor page →</a>
  <p class="small">Stuck? Email <a id="mail" href="#">the coordinator</a>.</p>
</div>

<script src="../config.js"></script>
<script>
(function () {
  var cfg = window.YMU || {};
  var url = (cfg.webAppUrl || '').trim();
  var card = document.getElementById('c');

  document.getElementById('mail').href = 'mailto:' + (cfg.coordinatorEmail || '');
  document.getElementById('mail').textContent = cfg.coordinatorEmail || 'YMU';

  if (!/^https:\/\/script\.google\.com\/.*\/exec$/.test(url)) {
    card.innerHTML = '<h1>Not set up yet</h1><div class="err">' +
      'This link has no web app URL behind it yet. Whoever set this up needs to paste the ' +
      'Apps Script <code>/exec</code> URL into <code>docs/config.js</code> and push.' +
      '</div>';
    return;
  }

  var go = document.getElementById('go');
  go.href = url;

  // A mentor's private link arrives as ?token= and goes on as ?m=, which is
  // the parameter the web app resolves against the mentor roster. Keeping the
  // two rosters on separate parameters means a token is never checked against
  // the wrong one. Anything else is passed straight through.
  var qs = new URLSearchParams(window.location.search);
  var tok = qs.get('token');
  if (tok) {
    go.href = url + '?m=' + encodeURIComponent(tok);
  } else {
    var rest = qs.toString();
    if (rest) go.href = url + '?' + rest;
  }

  // Auto-forward, but leave the button for anyone the redirect misses
  // (in-app browsers occasionally swallow replace()).
  setTimeout(function () { window.location.replace(go.href); }, 250);
})();
</script>
</body>
</html>
